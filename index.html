<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Widening the Frame</title>
<meta name="description" content="A 3D walk through the UCSC Farm, the Alan Chadwick Garden and the Produce Pop-Up, in Ian Malone's photos and video. ENVS 143, Fall 2026.">
<meta name="theme-color" content="#14110d">
<link rel="canonical" href="https://ian439.github.io/widening-the-frame/">
<meta property="og:type" content="website">
<meta property="og:title" content="Widening the Frame">
<meta property="og:description" content="A 3D walk through the UCSC Farm, the Alan Chadwick Garden and the Produce Pop-Up, in Ian Malone's photos and video. ENVS 143, Fall 2026.">
<meta property="og:url" content="https://ian439.github.io/widening-the-frame/">
<meta property="og:image" content="https://ian439.github.io/widening-the-frame/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='none' stroke='%23e9a46a' stroke-width='2.5'/%3E%3Crect x='10' y='10' width='12' height='12' rx='1.5' fill='%23a8c495'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css?v=18">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="app" id="app">
  <aside class="story" id="story" aria-label="The walk">
    <header class="story-top">
      <button class="brand" id="brand" type="button" aria-label="Back to the start">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="3"/><rect class="in" x="10" y="10" width="12" height="12" rx="1.5"/></svg>
        <span>Widening the Frame</span>
      </button>
      <button class="about-btn" id="aboutBtn" type="button">About</button>
    </header>
    <div class="story-scroll" id="storyScroll">
      <div class="stops" id="stops"></div>
    </div>
    <div class="prog" aria-hidden="true"><i id="prog"></i></div>
    <nav class="story-nav" aria-label="Stops">
      <button class="nav-btn" id="prev" type="button" aria-label="Previous stop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <ol class="dots" id="dots"></ol>
      <button class="nav-btn play" id="play" type="button" aria-pressed="false" aria-label="Play the walk">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>
      </button>
      <button class="nav-btn next" id="next" type="button"><span id="nextLabel">Next</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </nav>
  </aside>

  <main class="stage" id="stage">
    <canvas id="scene" aria-label="3D map of the UCSC Farm, the Alan Chadwick Garden and the Produce Pop-Up locations"></canvas>
    <div class="pins" id="pins" aria-hidden="false"></div>
    <div class="layers" id="layers" role="group" aria-label="Map layers"></div>
    <div class="map-tools">
      <button class="tool tool-wide" id="closer" type="button" hidden title="Fly down into the rows and see the plants">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V11M12 11c0-4 3-7 7-7 0 4-3 7-7 7zM12 14c0-3-2.5-5.5-6-5.5 0 3.5 2.5 5.5 6 5.5z"/></svg><span>Into the rows</span>
      </button>
      <button class="tool" id="resetView" type="button" aria-label="Return to this stop's view" title="Return to this stop's view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg>
      </button>
    </div>
    <p class="hint" id="hint">Drag to look around · scroll or pinch to zoom</p>
    <div class="now" id="now" aria-live="polite"><p class="now-k" id="nowK"></p><p class="now-note" id="nowNote"></p></div>
    <div class="mini" id="mini" aria-label="Overview map"></div>
    <div class="loading" id="loading"><span class="ld-frame"></span><span id="loadingText">Loading the map</span></div>
  </main>
</div>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo">
  <div class="lb-bar"><span id="lbCaption"></span><button class="lb-close" id="lbClose" type="button">Close</button></div>
  <div class="lb-img"><img id="lbImg" alt=""></div>
</div>

<div class="modal" id="about" hidden role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
  <div class="modal-card">
    <header><h2 id="aboutTitle">About this walk</h2><button class="lb-close" id="aboutClose" type="button">Close</button></header>
    <div class="modal-body" id="aboutBody"></div>
  </div>
</div>

<script type="module" src="app.js?v=93"></script>
</body>
</html>
